name: Workflow lint
on:
  workflow_call:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout pulp-oci-images
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1

  actions-lock:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout pulp-oci-images
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify actions.lock is up to date
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
